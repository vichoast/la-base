<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16182a">
<meta name="description" content="Un juego de construir que premia partir con las tareas de la casa, la U y la práctica.">
<title>La Base</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Silkscreen:wght@400;700&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{
  /* Pixel art de noche: la base es lo que brilla. Bordes duros, sombras de un bloque, sin curvas. */
  --bg:#16182a; --panel:#22253d; --panel-2:#2d3150; --line:#3d4270; --line-2:#535a92;
  --ink:#f4efe1; --muted:#b0b5d4; --accent:#ffcd4a; --accent-d:#c48f12; --accent-ink:#2a1d00;
  --good:#7ee08a; --good-d:#2f6b3c; --red:#ef6a5e;
  --px:"Press Start 2P",ui-monospace,monospace;
  --head:"Silkscreen",ui-monospace,monospace;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --nav-h:64px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.4;-webkit-font-smoothing:antialiased;padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 16px);-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.pxb{border:3px solid var(--line);box-shadow:0 4px 0 #0d0e1a}
header.top{display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;background:var(--bg);position:sticky;top:0;z-index:5;border-bottom:3px solid var(--line)}
.logo{font-family:var(--px);font-size:13px;line-height:1;color:var(--accent);letter-spacing:.04em;white-space:nowrap}
.stats{display:flex;gap:6px;margin-left:auto}
.stat{display:flex;align-items:center;gap:6px;background:var(--panel);border:2px solid var(--line);padding:4px 7px;font-family:var(--px);font-size:10px;font-variant-numeric:tabular-nums;white-space:nowrap}
.stat .l{color:var(--muted)}
.xpbar{display:block;width:100%;height:4px;background:var(--line);margin-top:4px}
.xpbar i{display:block;height:100%;background:var(--accent);width:0;transition:width .6s steps(8)}
.ico{display:inline-block;flex:none;image-rendering:pixelated}
.ico.brick{width:14px;height:10px;background:linear-gradient(#e2734a 0 70%,#a8452a 70%);box-shadow:inset 0 0 0 1px #6e2a17}
.ico.flame{width:10px;height:12px;background:
  linear-gradient(to right,transparent 0 30%,#ffd36b 30% 70%,transparent 70%) 0 0/100% 33% no-repeat,
  linear-gradient(to right,transparent 0 10%,#ff9a3d 10% 90%,transparent 90%) 0 50%/100% 34% no-repeat,
  linear-gradient(#ff6a3d,#ff6a3d) 0 100%/100% 33% no-repeat}

/* mundo */
.world{position:relative;background:#0d1722;border-bottom:3px solid var(--line);height:42vh;min-height:280px}
.world canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.projbar{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--panel);border-bottom:3px solid var(--line);flex-wrap:wrap}
.projbar .lab{font-size:14px;color:var(--muted)}
.projbar b{font-weight:700}
.pips{display:flex;gap:3px}
.pips i{width:14px;height:8px;background:var(--line)}
.pips i.on{background:var(--accent)}
.projbar .right{margin-left:auto;font-size:14px;color:var(--muted)}

main{max-width:720px;margin:0 auto;padding:16px}
.tab{display:flex;flex-direction:column;gap:14px}
.tab[hidden]{display:none}
h2{font-family:var(--head);font-weight:400;font-size:14px;letter-spacing:.04em;margin:6px 0 0;color:var(--muted);line-height:1.3}

/* barra inferior */
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--panel);border-top:3px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom)}
nav.bottom button{background:none;border:0;height:var(--nav-h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-family:var(--px);font-size:8px;color:var(--muted);letter-spacing:.03em}
nav.bottom button canvas{width:24px;height:24px;image-rendering:pixelated}
nav.bottom button[aria-selected="true"]{color:var(--accent);background:var(--panel-2)}

/* botones */
.btn{background:var(--panel-2);border:3px solid var(--line-2);box-shadow:0 3px 0 #0d0e1a;padding:9px 13px;font-weight:700;font-size:16px;min-height:44px;transition:transform .05s}
.btn:active{transform:translateY(3px);box-shadow:none}
.btn.primary{background:var(--accent);border-color:var(--accent-d);color:var(--accent-ink);box-shadow:0 3px 0 var(--accent-d)}
.btn.ghost{background:none;border-color:var(--line);box-shadow:none}
.btn.good{background:var(--good);border-color:var(--good-d);color:#0f2414;box-shadow:0 3px 0 var(--good-d)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:8px}

/* energía (Media Pila) */
.energy{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.energy button{background:var(--panel);border:3px solid var(--line);padding:10px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;min-height:44px}
.energy button b{font-size:16px}
.energy button span.s{font-size:13px;color:var(--muted)}
.energy button[aria-pressed="true"]{border-color:var(--accent);background:#33301f}
.batt{display:flex;align-items:center;gap:0}
.batt .body{display:flex;gap:2px;padding:2px;border:2px solid var(--muted)}
.batt .body i{width:6px;height:10px;background:transparent}
.batt .body i.f{background:var(--good)}
.batt.low .body i.f{background:var(--red)}
.batt .tip{width:3px;height:6px;background:var(--muted)}
.focus{display:flex;gap:6px;flex-wrap:wrap}
.focus button{background:var(--bg);border:2px solid var(--line);padding:6px 10px;font-size:15px;font-weight:600;min-height:40px}
.focus button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}

.quick{background:var(--accent);color:var(--accent-ink);border:3px solid var(--accent-d);box-shadow:0 5px 0 var(--accent-d);padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:left;transition:transform .05s}
.quick:active{transform:translateY(5px);box-shadow:none}
.quick b{font-family:var(--head);font-weight:700;font-size:20px;letter-spacing:.02em;display:block;line-height:1.2}
.quick span{font-size:15px}
.quick .go{font-family:var(--px);font-size:20px}

.cards{display:flex;flex-direction:column;gap:10px}
.card{background:var(--panel);border:3px solid var(--line);padding:12px;display:flex;flex-direction:column;gap:10px}
.card .t{font-weight:700;font-size:17px}
.card .hecha{color:var(--good);font-size:14px;font-weight:700;margin-left:6px}
.meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:14px;color:var(--muted);margin-top:4px}
.zone{font-family:var(--head);font-size:11px;font-weight:400;text-transform:uppercase;padding:2px 6px;color:#10131f}
.acts{display:flex;gap:8px;justify-content:flex-end}
.acts .btn{flex:1}

.today{background:var(--panel);border:3px solid var(--line);padding:12px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.today b{display:block;font-family:var(--px);font-weight:400;font-size:16px;font-variant-numeric:tabular-nums;margin-bottom:4px}
.today span{font-size:13px;color:var(--muted)}
.chest{grid-column:1/-1;display:flex;align-items:center;gap:10px;font-size:15px;color:var(--muted);border-top:2px solid var(--line);padding-top:10px}
.chest canvas{width:32px;height:32px;image-rendering:pixelated;flex:none}

details.own{background:var(--panel);border:3px dashed var(--line);padding:10px 12px}
details.own summary{cursor:pointer;font-weight:700;font-size:16px;color:var(--muted);min-height:28px}
details.own .row{margin-top:10px}
input[type=text],input[type=number],input[type=time],select{background:var(--bg);border:3px solid var(--line);color:var(--ink);padding:9px 10px;font:inherit;font-size:16px;min-width:0;min-height:44px;border-radius:0}
.grow{flex:1 1 180px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{background:var(--bg);border:2px solid var(--line);padding:6px 10px;font-size:14px;font-weight:700;min-height:40px}
.chips button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.pend{display:flex;flex-direction:column;gap:8px}
.pitem{background:var(--panel);border:3px solid var(--line);padding:8px 8px 8px 12px;display:flex;align-items:center;gap:8px}
.pitem .n{flex:1;min-width:0;font-weight:600;overflow-wrap:anywhere}
.pitem .m{font-size:13px;color:var(--muted);white-space:nowrap}
.empty{font-size:15px;color:var(--muted);margin:0}

.welcome{background:#2c2a1e;border:3px solid #6b5a22;padding:14px;display:flex;gap:12px;align-items:flex-start}
.welcome p{margin:0 0 10px}
.welcome .h{font-family:var(--head);font-weight:700;font-size:18px;color:var(--accent);margin-bottom:8px;line-height:1.6}
.welcome canvas{width:48px;height:64px;image-rendering:pixelated;flex:none}
.install{background:#1f2b3d;border:3px solid #3f6390;padding:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.install p{margin:0;flex:1 1 200px;font-size:15px}

.bars{display:grid;grid-template-columns:repeat(14,1fr);gap:3px;align-items:end;height:110px;background:var(--panel);border:3px solid var(--line);padding:12px 10px 28px}
.bars div{background:var(--accent);position:relative}
.bars div.zero{background:var(--line)}
.bars div span{position:absolute;bottom:-20px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--muted)}
.totals{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.totals div{background:var(--panel);border:3px solid var(--line);padding:10px 12px}
.totals b{display:block;font-family:var(--px);font-weight:400;font-size:15px;font-variant-numeric:tabular-nums;margin-bottom:6px}
.totals span{font-size:14px;color:var(--muted)}
.zbars{display:flex;flex-direction:column;gap:6px;background:var(--panel);border:3px solid var(--line);padding:12px}
.zbar{display:grid;grid-template-columns:110px 1fr 28px;gap:8px;align-items:center;font-size:14px}
.zbar .tr{height:10px;background:var(--line)}
.zbar .tr i{display:block;height:100%}
.zbar b{text-align:right;font-variant-numeric:tabular-nums}
.achs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.ach{background:var(--panel);border:3px solid var(--line);padding:10px;font-size:14px}
.ach b{display:block;font-size:15px}
.ach span{color:var(--muted)}
.ach.lock{opacity:.5}
.ach.on{border-color:#6b5a22;background:#2c2a1e}
.ach.on b{color:var(--accent)}
.rewards{display:flex;flex-direction:column;gap:8px}
.reward{background:var(--panel);border:3px solid var(--line);padding:10px 12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.reward .n{flex:1 1 140px;font-weight:700}
.reward .c{display:flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums;color:var(--muted);font-size:15px}
.x{background:none;border:0;color:var(--muted);font-size:22px;padding:2px 10px;line-height:1;min-height:40px;min-width:40px}
.note{font-size:15px;color:var(--muted);max-width:62ch;margin:0}
.set{background:var(--panel);border:3px solid var(--line);padding:12px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.set > div:first-child{flex:1 1 200px}
.set .lbl{font-weight:700;display:block}
.set small{display:block;color:var(--muted);font-size:14px}
.switch{width:52px;height:30px;background:var(--line);border:3px solid var(--line-2);position:relative;flex:none;padding:0}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;background:var(--ink);transition:left .1s steps(3)}
.switch[aria-checked="true"]{background:var(--accent);border-color:var(--accent-d)}
.switch[aria-checked="true"]::after{left:25px;background:var(--accent-ink)}

/* hojas */
.overlay{position:fixed;inset:0;z-index:20;background:rgba(8,9,20,.82);display:flex;align-items:flex-end;justify-content:center;padding:0}
.overlay[hidden]{display:none}
.sheet{background:var(--panel);border:3px solid var(--line-2);border-bottom:0;width:min(560px,100%);max-height:94vh;overflow:auto;padding:18px 16px calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px;animation:up .18s steps(4)}
@keyframes up{from{transform:translateY(40px);opacity:.3}}
@media (min-width:700px){.overlay{align-items:center;padding:16px}.sheet{border-bottom:3px solid var(--line-2)}}
.sheet h3.d{margin:0;font-family:var(--head);font-weight:700;font-size:22px;line-height:1.2}
.mhead{display:flex;align-items:flex-start;gap:10px}
.mhead h3{margin:6px 0 0;font-size:20px}
.mhead .x{margin-left:auto}
.timerwrap{display:flex;align-items:center;gap:14px}
.clock{flex:none;width:112px;text-align:center;background:var(--bg);border:3px solid var(--line);padding:10px 6px}
.clock b{display:block;font-family:var(--px);font-weight:400;font-size:18px;font-variant-numeric:tabular-nums}
.clock span{font-size:13px;color:var(--muted)}
.tbar{display:flex;gap:2px;margin-top:8px}
.tbar i{flex:1;height:6px;background:var(--line)}
.tbar i.on{background:var(--accent)}
.buddy{display:flex;align-items:flex-end;gap:8px;flex:1;min-width:0}
.buddy canvas{width:48px;height:64px;flex:none;image-rendering:pixelated;animation:bob 1s steps(2) infinite}
@keyframes bob{50%{transform:translateY(-3px)}}
.bubble{background:var(--bg);border:3px solid var(--line);padding:8px 10px;font-size:16px;min-height:44px;flex:1}
.bubble small{display:block;font-family:var(--head);font-weight:400;font-size:12px;color:var(--accent);margin-bottom:4px}
.steps{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.steps button{width:100%;text-align:left;background:var(--bg);border:3px solid var(--line);padding:12px;display:flex;gap:12px;align-items:center;font-size:17px;min-height:52px}
.steps .box{width:22px;height:22px;border:3px solid var(--muted);flex:none;position:relative}
.steps button.ok{border-color:var(--good-d);background:#16271c}
.steps button.ok .box{background:var(--good);border-color:var(--good)}
.steps button.ok .box::after{content:"";position:absolute;left:4px;top:0;width:5px;height:10px;border:solid #0f1f16;border-width:0 3px 3px 0;transform:rotate(45deg)}
.steps button.ok .s{text-decoration:line-through;color:var(--muted)}
.mfoot{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mfoot .btn.primary{flex:1 1 100%;padding:14px;font-family:var(--head);font-weight:700;font-size:20px}
.mfoot .btn:not(.primary){flex:1}
.pulse{animation:pulse .8s steps(2) infinite}
@keyframes pulse{50%{box-shadow:0 3px 0 var(--accent-d),0 0 0 5px rgba(255,205,74,.35)}}
.rew{text-align:center;align-items:center}
.rew .big{font-family:var(--px);font-size:30px;line-height:1;color:var(--accent);display:flex;align-items:center;gap:12px}
.rew .big .ico.brick{width:28px;height:20px}
.rew .xp{font-size:15px;color:var(--muted)}
.rew .lines{display:flex;flex-direction:column;gap:6px;font-size:16px;max-width:44ch}
.rew .lvl{background:#2c2a1e;border:3px solid #6b5a22;padding:8px 12px;color:var(--accent);font-weight:700}
.rew .row{justify-content:center}
.pick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pick button{background:var(--bg);border:3px solid var(--line);padding:8px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:4px}
.pick button:hover,.pick button:focus-visible{border-color:var(--accent)}
.pick canvas{width:100%;max-width:120px;height:auto;aspect-ratio:240/220}
.pick b{font-size:15px}
.pick span{font-size:13px;color:var(--muted)}
#toasts{position:fixed;left:50%;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 12px);transform:translateX(-50%);z-index:40;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:min(440px,calc(100% - 32px))}
.toast{background:#2a3a55;border:3px solid #4a6390;padding:10px 14px;font-size:15px;box-shadow:0 4px 0 #0d0e1a;animation:tin .2s steps(3)}
.toast b{color:var(--accent)}
@keyframes tin{from{transform:translateY(8px);opacity:0}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (min-width:900px){
  .shell{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);align-items:start}
  .side{position:sticky;top:52px}
  .world{height:calc(100vh - 140px)}
  main{max-width:none}
}
@media (max-width:380px){
  .stat .l{display:none}
  .energy button span.s{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="logo">LA BASE</div>
  <div class="stats">
    <div class="stat" title="Nivel"><span><span class="l">NV </span><b id="s-lvl">1</b><span class="xpbar" aria-hidden="true"><i id="s-xp"></i></span></span></div>
    <div class="stat" title="Ladrillos"><span class="ico brick" aria-hidden="true"></span><b id="s-bricks">0</b></div>
    <div class="stat" title="Racha"><span class="ico flame" aria-hidden="true"></span><b id="s-streak">0</b><span class="l" id="s-shields"></span></div>
  </div>
</header>
<div class="shell">
  <div class="side">
    <section class="world" id="worldbox" aria-label="Tu base"><canvas id="world"></canvas></section>
    <div class="projbar" id="proj"></div>
  </div>
  <main>
    <div class="tab" id="tab-misiones"></div>
    <div class="tab" id="tab-progreso" hidden></div>
    <div class="tab" id="tab-premios" hidden></div>
    <div class="tab" id="tab-ajustes" hidden></div>
  </main>
</div>
<nav class="bottom" role="tablist" aria-label="Secciones">
  <button role="tab" data-tab="misiones" aria-selected="true"><canvas width="12" height="12" data-icon="mision"></canvas>MISIONES</button>
  <button role="tab" data-tab="progreso" aria-selected="false"><canvas width="12" height="12" data-icon="progreso"></canvas>PROGRESO</button>
  <button role="tab" data-tab="premios" aria-selected="false"><canvas width="12" height="12" data-icon="premio"></canvas>PREMIOS</button>
  <button role="tab" data-tab="ajustes" aria-selected="false"><canvas width="12" height="12" data-icon="ajustes"></canvas>AJUSTES</button>
</nav>
<div class="overlay" id="ov" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div id="toasts" aria-live="polite"></div>

<script>
(()=>{
'use strict';
/* ---------- utilidades ---------- */
const $=s=>document.querySelector(s);
function el(tag,attrs,...kids){const e=document.createElement(tag);attrs=attrs||{};for(const k in attrs){const v=attrs[k];if(v===false||v==null)continue;if(k==='class')e.className=v;else if(k==='html')e.innerHTML=v;else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);else e.setAttribute(k,v);}for(const c of kids.flat()){if(c==null||c===false)continue;e.append(c.nodeType?c:document.createTextNode(String(c)));}return e;}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function dayKey(d){d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function dayNum(k){const p=k.split('-').map(Number);return Math.round(Date.UTC(p[0],p[1]-1,p[2])/864e5);}
function yesterday(){const n=new Date();return dayKey(new Date(n.getFullYear(),n.getMonth(),n.getDate()-1));}

/* ---------- motor isométrico (el mundo 3D de La Base 1) ---------- */
const TW=64,TH=32;
const R={ctx:null,ox:0,oy:0,s:1};
function P(gx,gy,z){return[R.ox+(gx-gy)*TW/2*R.s,R.oy+(gx+gy)*TH/2*R.s-z*R.s];}
function poly(pts,fill,stroke){const c=R.ctx;c.beginPath();c.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)c.lineTo(pts[i][0],pts[i][1]);c.closePath();c.fillStyle=fill;c.fill();if(stroke!==false){c.strokeStyle=stroke||'rgba(0,0,0,.22)';c.lineWidth=Math.max(.6,R.s*.8);c.lineJoin='round';c.stroke();}}
function rgb(h){h=h.replace('#','');return[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];}
function shade(h,f){const c=rgb(h),t=f<0?0:255,p=Math.abs(f);return'rgb('+c.map(v=>Math.round(v+(t-v)*p)).join(',')+')';}
function box(cx,cy,z,w,d,h,col,o){o=o||{};const x0=cx-w/2,x1=cx+w/2,y0=cy-d/2,y1=cy+d/2,c=R.ctx;if(o.alpha!=null){c.save();c.globalAlpha=o.alpha;}
 poly([P(x0,y1,z),P(x1,y1,z),P(x1,y1,z+h),P(x0,y1,z+h)],o.left||col);
 poly([P(x1,y1,z),P(x1,y0,z),P(x1,y0,z+h),P(x1,y1,z+h)],o.right||shade(col,-.25));
 poly([P(x0,y0,z+h),P(x1,y0,z+h),P(x1,y1,z+h),P(x0,y1,z+h)],o.top||shade(col,.14));
 if(o.alpha!=null)c.restore();}
function face(cx,cy,z,w,d,h,side,u0,u1,v0,v1,col){const f=side==='L'?(u,v)=>P(cx-w/2+u*w,cy+d/2,z+v*h):(u,v)=>P(cx+w/2,cy+d/2-u*d,z+v*h);poly([f(u0,v0),f(u1,v0),f(u1,v1),f(u0,v1)],col,false);}
function gable(cx,cy,z,w,d,h,col){const x0=cx-w/2,x1=cx+w/2,y0=cy-d/2,y1=cy+d/2;poly([P(x1,y0,z),P(x1,y1,z),P(x1,cy,z+h)],shade(col,-.3));poly([P(x0,y1,z),P(x1,y1,z),P(x1,cy,z+h),P(x0,cy,z+h)],col);}
function pyramid(cx,cy,z,w,d,h,col){const x0=cx-w/2,x1=cx+w/2,y0=cy-d/2,y1=cy+d/2,ap=P(cx,cy,z+h);poly([P(x1,y1,z),P(x1,y0,z),ap],shade(col,-.28));poly([P(x0,y1,z),P(x1,y1,z),ap],col);}
function glow(gx,gy,z,rad,color){const c=R.ctx,p=P(gx,gy,z),r=rad*R.s,g=c.createRadialGradient(p[0],p[1],0,p[0],p[1],r);g.addColorStop(0,color);g.addColorStop(1,'rgba(255,200,90,0)');c.save();c.globalCompositeOperation='lighter';c.fillStyle=g;c.beginPath();c.arc(p[0],p[1],r,0,Math.PI*2);c.fill();c.restore();}

 const now=Date.now();if(now-MS.lastStep>90000&&now-MS.lastIdle>90000){MS.lastIdle=now;say(pick(LINES.idle));}}
function endMission(){clearInterval(tick);tick=null;music.stop();try{if(wake)wake.release();}catch(e){}wake=null;const m=MS;MS=null;return m;}
function finishMission(){if(!MS)return;const n=MS.done.filter(Boolean).length;if(n===0){say('Marca los pasos que hiciste. Si no alcanzaste ninguno, usa Cortar acá.');return;}const m=endMission();complete(m.m,'timer',n);}
function cutMission(){if(!MS)return;const n=MS.done.filter(Boolean).length,m=endMission();if(n>0){complete(m.m,'timer',n);return;}closeSheet();toast('Partiste, y eso ya cuenta. Vuelve cuando quieras.');}

function complete(m,how,stepsDone){
 const total=m.p.length,frac=Math.max(1,stepsDone)/total,before=lvlInfo(S.xp).L;
 const bricks=Math.max(2,Math.round(baseBricks(m)*frac*(how==='timer'?1.2:1))),xp=Math.round((10+m.m*8)*frac);
 S.bricks+=bricks;S.xp+=xp;
 const d=dayKey();
 S.log.push({d,ts:Date.now(),id:m.id,z:m.z,e:S.energy,min:m.m,steps:stepsDone,of:total,how,br:bricks,t:m.custom?m.t:undefined});
 if(S.log.length>1500)S.log=S.log.slice(-1500);
 let pendDone=false;if(m.pid&&(stepsDone>=total||how==='ya')){S.pend=S.pend.filter(p=>p.id!==m.pid);pendDone=true;}
 let streakMsg=null;
 if(S.lastDay!==d){S.streak=S.lastDay===yesterday()?S.streak+1:1;S.lastDay=d;S.best=Math.max(S.best,S.streak);if(S.streak%7===0&&S.shields<2){S.shields++;streakMsg='Siete días seguidos: ganaste un casco. Si un día fallas, te salva la racha.';}}
 if(!S.proj)S.proj=newProj(pick(unlocked()));
 S.proj.stage++;
 const info={t:S.proj.t,stage:S.proj.stage,max:BUILDS[S.proj.t].st};
 ANIM={slot:S.proj.slot,stage:S.proj.stage,t0:performance.now()+350,burst:false};
 let built=null;if(S.proj.stage>=info.max){built=S.proj.t;S.built.push({t:S.proj.t,slot:S.proj.slot,at:Date.now()});S.proj=null;}
 if(S.chest.d!==d)S.chest={d,open:false};
 let chest=null;if(todayLog().length>=3&&!S.chest.open){S.chest.open=true;const b=10+Math.floor(Math.random()*16);S.bricks+=b;S.tickets++;chest={b};}
 const after=lvlInfo(S.xp).L,unl=after>before?Object.keys(BUILDS).filter(k=>BUILDS[k].lv>before&&BUILDS[k].lv<=after):[];
 const achNew=checkAch();
 save();renderAll();closeSheet();sfx.done();vibe([30,40,60]);
 window.scrollTo({top:0,behavior:reduce?'auto':'smooth'});
 
 setTimeout(()=>showReward({bricks,xp,info,built,chest,levelUp:after>before?after:0,unl,streakMsg,achNew,pendDone}),reduce?300:1500);}
function showReward(r){
 const b=BUILDS[r.info.t],lines=[];
 lines.push(r.built?'Terminaste '+b.a+'. Ya está en tu base.':b.n+': etapa '+r.info.stage+' de '+r.info.max+'.');
 if(r.pendDone)lines.push('Un pendiente menos en la lista.');
 if(r.chest)lines.push('Abriste el cofre del día: +'+r.chest.b+' ladrillos y 1 ticket para un premio.');
 if(r.streakMsg)lines.push(r.streakMsg);else lines.push('Racha: '+S.streak+(S.streak===1?' día.':' días seguidos.'));
 r.achNew.forEach(a=>lines.push('Logro nuevo: '+a));
 const nodes=[el('h3',{class:'d'},pick(['¡PIEZA PUESTA!','SUMASTE A TU BASE','ESO CUENTA','HECHO Y DERECHO'])),
  el('div',{class:'big'},el('span',{class:'ico brick','aria-hidden':'true'}),'+'+r.bricks),el('div',{class:'xp'},'ladrillos · +'+r.xp+' de experiencia')];
 if(r.levelUp)nodes.push(el('div',{class:'lvl'},'Subiste a nivel '+r.levelUp+(r.unl.length?'. Ahora puedes construir: '+r.unl.map(k=>BUILDS[k].n).join(', ')+'.':'.')));
 nodes.push(el('div',{class:'lines'},lines.map(l=>el('div',{},l))));
 const row=el('div',{class:'row'});
 if(r.built)row.append(el('button',{class:'btn primary',onclick:showPicker},'Elegir qué construir'));
 else row.append(el('button',{class:'btn primary',onclick:()=>{closeSheet();showTab('misiones');const c=document.querySelector('.cards');if(c)c.scrollIntoView({behavior:reduce?'auto':'smooth',block:'center'});}},'Otra misión'));
 row.append(el('button',{class:'btn',onclick:closeSheet},'Listo por ahora'));
 nodes.push(row);
 openSheet(nodes);$('#sheet').classList.add('rew');
 if(r.levelUp||r.built)setTimeout(()=>sfx.coin(),200);}
function showPicker(){
 const count=k=>S.built.filter(b=>b.t===k).length,opts=unlocked().map(k=>[k,count(k)+Math.random()*.9]).sort((a,b)=>a[1]-b[1]).slice(0,3).map(x=>x[0]);
 const grid=el('div',{class:'pick'});
 for(const k of opts){const b=BUILDS[k];grid.append(el('button',{onclick:()=>{S.proj=newProj(k);save();closeSheet();renderAll();scrollToProj();sfx.coin();toast('Partiste con <b>'+esc(b.n)+'</b>: '+b.st+' misiones y queda lista.');}},previewCanvas(k),el('b',{},b.n),el('span',{},b.st+' etapas')));}
 const L=lvlInfo(S.xp).L,nx=Object.values(BUILDS).filter(b=>b.lv>L).sort((a,b)=>a.lv-b.lv)[0];
 openSheet([el('h3',{class:'d'},'¿QUÉ CONSTRUYES AHORA?'),el('p',{class:'note'},'Cada misión que termines suma una etapa.'),grid,nx?el('p',{class:'note'},'En el nivel '+nx.lv+' se desbloquea '+nx.a+'.'):null]);}

/* ---------- arranque ---------- */
/* si en este navegador está el avance de La Base 1 y aquí no hay nada, se trae solo */
let loaded=loadLocal(),fromV1=false;
if(!loaded){try{const v1=localStorage.getItem('la-base-v1');if(v1){loaded=JSON.parse(v1);fromV1=true;}}catch(e){}}
S=migrate(loaded);if(fromV1){save();later('Traje tu avance de La Base 1: <b>'+S.log.length+'</b> misiones y <b>'+S.bricks+'</b> ladrillos.');}
checkStreak();renderAll();navIcons();requestAnimationFrame(frame);setTimeout(scrollToProj,300);
if('serviceWorker' in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
